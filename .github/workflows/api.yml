name: Publicar API en Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run test
      - run: npm run build:worker
      - run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_USERS_JSON: ${{ secrets.APP_USERS_JSON }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          PULSE_ENCRYPTION_KEY: ${{ secrets.PULSE_ENCRYPTION_KEY }}
          ARX_PASSWORD: ${{ secrets.ARX_PASSWORD }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
